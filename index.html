
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color"
          content="#111827">

    <title>SSO Cash Record</title>


    <style>

        /* =====================================================
           GLOBAL
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {

            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --secondary: #7c3aed;

            --background: #f3f4f6;
            --card: #ffffff;

            --text: #111827;
            --muted: #6b7280;

            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;

            --border: #e5e7eb;

            --radius: 18px;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(99,102,241,.15),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #f8fafc,
                    #eef2ff
                );

            color: var(--text);

            min-height: 100vh;

            -webkit-tap-highlight-color:
                transparent;
        }


        /* =====================================================
           APP
        ===================================================== */

        .app {

            width: 100%;

            max-width: 520px;

            margin: auto;

            min-height: 100vh;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            padding: 22px 18px 18px;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #312e81,
                    #4f46e5
                );

            color: white;

            border-radius:
                0 0 28px 28px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,.15);

            position: relative;

            overflow: hidden;
        }


        .header::after {

            content: "";

            position: absolute;

            width: 190px;

            height: 190px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.08);

            right: -60px;

            top: -70px;
        }


        .header-top {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            position: relative;

            z-index: 2;
        }


        .logo {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .logo-icon {

            width: 43px;

            height: 43px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 13px;

            background:
                rgba(255,255,255,.15);

            font-size: 22px;
        }


        .logo-title {

            font-size: 21px;

            font-weight: 800;
        }


        .logo-subtitle {

            font-size: 11px;

            opacity: .75;

            margin-top: 2px;
        }


        .month-badge {

            background:
                rgba(255,255,255,.13);

            border:
                1px solid
                rgba(255,255,255,.18);

            padding:
                8px 11px;

            border-radius: 12px;

            font-size: 11px;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {

            padding: 16px;
        }


        /* =====================================================
           SUMMARY
        ===================================================== */

        .summary-card {

            background:
                white;

            border-radius:
                var(--radius);

            padding: 18px;

            box-shadow:
                0 8px 25px
                rgba(15,23,42,.07);

            margin-bottom: 16px;
        }


        .summary-label {

            color:
                var(--muted);

            font-size:
                12px;

            text-transform:
                uppercase;

            letter-spacing:
                .7px;
        }


        .summary-amount {

            font-size:
                32px;

            font-weight:
                850;

            margin-top:
                5px;

            letter-spacing:
                -1px;
        }


        .summary-grid {

            display:
                grid;

            grid-template-columns:
                repeat(3,1fr);

            gap:
                8px;

            margin-top:
                16px;
        }


        .summary-mini {

            padding:
                11px;

            border-radius:
                13px;

            background:
                #f8fafc;

            text-align:
                center;
        }


        .summary-mini strong {

            display:
                block;

            font-size:
                15px;
        }


        .summary-mini span {

            color:
                var(--muted);

            font-size:
                10px;
        }


        /* =====================================================
           CARD
        ===================================================== */

        .card {

            background:
                var(--card);

            border-radius:
                var(--radius);

            padding:
                18px;

            box-shadow:
                0 8px 25px
                rgba(15,23,42,.07);

            margin-bottom:
                16px;
        }


        .card-title {

            font-size:
                17px;

            font-weight:
                800;

            margin-bottom:
                16px;

            display:
                flex;

            align-items:
                center;

            gap:
                8px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group {

            margin-bottom:
                14px;
        }


        label {

            display:
                block;

            font-size:
                12px;

            font-weight:
                700;

            margin-bottom:
                7px;

            color:
                #374151;
        }


        input,
        select,
        textarea {

            width:
                100%;

            border:
                1px solid
                var(--border);

            background:
                #f9fafb;

            border-radius:
                13px;

            padding:
                14px;

            font-size:
                16px;

            color:
                var(--text);

            outline:
                none;

            transition:
                .2s;
        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color:
                var(--primary);

            background:
                white;

            box-shadow:
                0 0 0 3px
                rgba(79,70,229,.10);
        }


        textarea {

            min-height:
                90px;

            resize:
                vertical;
        }


        .user-row {

            display:
                grid;

            grid-template-columns:
                1.4fr 1fr;

            gap:
                10px;
        }


        /* =====================================================
           OTP
        ===================================================== */

        .otp-wrapper {

            position:
                relative;
        }


        .toggle-otp {

            position:
                absolute;

            right:
                10px;

            top:
                50%;

            transform:
                translateY(-50%);

            border:
                none;

            background:
                none;

            font-size:
                11px;

            color:
                var(--primary);

            font-weight:
                700;

            cursor:
                pointer;
        }


        .otp-status {

            font-size:
                11px;

            margin-top:
                6px;

            min-height:
                15px;
        }


        .otp-valid {

            color:
                var(--success);
        }


        .otp-invalid {

            color:
                var(--danger);
        }


        /* =====================================================
           RECEIPT
        ===================================================== */

        .receipt-upload {

            border:
                2px dashed
                #c7d2fe;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f5f3ff
                );

            border-radius:
                16px;

            min-height:
                125px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            text-align:
                center;

            cursor:
                pointer;

            position:
                relative;

            overflow:
                hidden;
        }


        .receipt-upload input {

            position:
                absolute;

            inset:
                0;

            opacity:
                0;

            cursor:
                pointer;
        }


        .upload-content {

            pointer-events:
                none;
        }


        .upload-icon {

            font-size:
                31px;

            margin-bottom:
                5px;
        }


        .upload-title {

            font-weight:
                800;

            font-size:
                13px;
        }


        .upload-subtitle {

            font-size:
                10px;

            color:
                var(--muted);

            margin-top:
                4px;
        }


        .receipt-preview {

            display:
                none;

            margin-top:
                10px;

            border-radius:
                13px;

            overflow:
                hidden;

            background:
                #f8fafc;

            padding:
                8px;
        }


        .receipt-preview img {

            width:
                100%;

            max-height:
                220px;

            object-fit:
                contain;

            border-radius:
                10px;
        }


        .file-name {

            font-size:
                11px;

            color:
                var(--muted);

            margin-top:
                6px;

            word-break:
                break-word;
        }


        /* =====================================================
           SAVE BUTTON
        ===================================================== */

        .save-btn {

            width:
                100%;

            border:
                none;

            border-radius:
                14px;

            padding:
                16px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );

            color:
                white;

            font-size:
                15px;

            font-weight:
                800;

            cursor:
                pointer;

            box-shadow:
                0 10px 20px
                rgba(79,70,229,.25);

            transition:
                .2s;
        }


        .save-btn:active {

            transform:
                scale(.98);
        }


        .save-btn:disabled {

            opacity:
                .55;

            cursor:
                not-allowed;

            box-shadow:
                none;
        }


        /* =====================================================
           FILTER
        ===================================================== */

        .filter-row {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                9px;

            margin-bottom:
                13px;
        }


        /* =====================================================
           TRANSACTION
        ===================================================== */

        .transaction {

            border:
                1px solid
                var(--border);

            border-radius:
                15px;

            padding:
                14px;

            margin-bottom:
                10px;

            background:
                white;
        }


        .transaction-top {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                flex-start;

            gap:
                10px;
        }


        .transaction-category {

            font-size:
                10px;

            font-weight:
                800;

            color:
                var(--primary);

            background:
                #eef2ff;

            padding:
                5px 8px;

            border-radius:
                8px;

            display:
                inline-block;

            margin-bottom:
                6px;
        }


        .transaction-reason {

            font-size:
                14px;

            font-weight:
                750;
        }


        .transaction-comment {

            font-size:
                11px;

            color:
                var(--muted);

            margin-top:
                3px;
        }


        .transaction-amount {

            font-size:
                17px;

            font-weight:
                850;

            white-space:
                nowrap;
        }


        .transaction-meta {

            display:
                flex;

            justify-content:
                space-between;

            margin-top:
                11px;

            padding-top:
                10px;

            border-top:
                1px solid
                #f1f5f9;

            font-size:
                10px;

            color:
                var(--muted);
        }


        .transaction-actions {

            display:
                flex;

            gap:
                6px;

            margin-top:
                9px;
        }


        .small-btn {

            border:
                none;

            border-radius:
                9px;

            padding:
                7px 10px;

            font-size:
                10px;

            font-weight:
                700;

            cursor:
                pointer;
        }


        .receipt-btn {

            background:
                #ecfdf5;

            color:
                var(--success);
        }


        .delete-btn {

            background:
                #fef2f2;

            color:
                var(--danger);
        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .empty {

            text-align:
                center;

            padding:
                28px 10px;

            color:
                var(--muted);
        }


        .empty-icon {

            font-size:
                38px;

            margin-bottom:
                8px;
        }


        .empty-title {

            font-size:
                14px;

            font-weight:
                750;

            color:
                #374151;
        }


        .empty-text {

            font-size:
                11px;

            margin-top:
                4px;
        }


        /* =====================================================
           EXPORT
        ===================================================== */

        .export-btn {

            width:
                100%;

            border:
                1px solid
                var(--border);

            background:
                white;

            color:
                #374151;

            padding:
                12px;

            border-radius:
                12px;

            font-weight:
                750;

            cursor:
                pointer;

            margin-top:
                5px;
        }


        /* =====================================================
           TOAST
        ===================================================== */

        .toast {

            position:
                fixed;

            left:
                50%;

            bottom:
                20px;

            transform:
                translate(-50%,120px);

            width:
                calc(100% - 32px);

            max-width:
                480px;

            background:
                #111827;

            color:
                white;

            padding:
                13px 16px;

            border-radius:
                13px;

            font-size:
                12px;

            font-weight:
                650;

            text-align:
                center;

            z-index:
                9999;

            opacity:
                0;

            transition:
                .3s;
        }


        .toast.show {

            transform:
                translate(-50%,0);

            opacity:
                1;
        }


        .toast.success {

            background:
                #065f46;
        }


        .toast.error {

            background:
                #991b1b;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            position:
                fixed;

            inset:
                0;

            background:
                rgba(255,255,255,.75);

            backdrop-filter:
                blur(5px);

            display:
                none;

            align-items:
                center;

            justify-content:
                center;

            z-index:
                10000;
        }


        .loading-box {

            background:
                white;

            border-radius:
                18px;

            padding:
                25px;

            text-align:
                center;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,.15);
        }


        .spinner {

            width:
                34px;

            height:
                34px;

            border:
                4px solid
                #e5e7eb;

            border-top-color:
                var(--primary);

            border-radius:
                50%;

            animation:
                spin .7s linear infinite;

            margin:
                auto auto 10px;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }


        /* =====================================================
           DESKTOP
        ===================================================== */

        @media (min-width:700px) {

            body {
                padding:25px;
            }


            .app {

                max-width:
                    850px;

                min-height:
                    auto;
            }


            .header {

                border-radius:
                    24px;
            }


            .main {

                padding:
                    20px 0;
            }


            .form-layout {

                display:
                    grid;

                grid-template-columns:
                    1fr 1fr;

                gap:
                    16px;
            }


            .full-width {

                grid-column:
                    1 / -1;
            }


            .transaction-list {

                display:
                    grid;

                grid-template-columns:
                    repeat(2,1fr);

                gap:
                    10px;
            }


            .transaction {

                margin-bottom:
                    0;
            }

        }


        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width:360px) {

            .main {
                padding:
                    11px;
            }


            .header {
                padding:
                    18px 14px;
            }


            .card,
            .summary-card {
                padding:
                    14px;
            }


            .summary-amount {
                font-size:
                    27px;
            }


            .user-row {
                grid-template-columns:
                    1fr;
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="header-top">

            <div class="logo">

                <div class="logo-icon">
                    💰
                </div>

                <div>

                    <div class="logo-title">
                        Sonesta Silver Oak Monthly Cash Record
                    </div>

                    <div class="logo-subtitle">
                        Monthly Expense Tracker
                    </div>

                </div>

            </div>


            <div
                class="month-badge"
                id="headerMonth">
            </div>

        </div>

    </header>



    <main class="main">


        <!-- =================================================
             SUMMARY
        ================================================== -->

        <section class="summary-card">

            <div class="summary-label">
                Total Spent This Month
            </div>


            <div
                class="summary-amount"
                id="totalAmount">

                ₹0

            </div>


            <div class="summary-grid">

                <div class="summary-mini">

                    <strong
                        id="transactionCount">
                        0
                    </strong>

                    <span>
                        Transactions
                    </span>

                </div>


                <div class="summary-mini">

                    <strong
                        id="userCount">
                        0
                    </strong>

                    <span>
                        Users
                    </span>

                </div>


                <div class="summary-mini">

                    <strong
                        id="categoryCount">
                        0
                    </strong>

                    <span>
                        Categories
                    </span>

                </div>

            </div>

        </section>



        <!-- =================================================
             ADD EXPENSE
        ================================================== -->

        <section class="card">

            <div class="card-title">
                ➕ Add Cash Expense
            </div>


            <form
                id="expenseForm">


                <div class="form-layout">


                    <!-- USER -->

                    <div class="form-group">

                        <label>
                            👤 Username
                        </label>


                        <select
                            id="username"
                            required>

                            <option value="">
                                Select User
                            </option>

                        </select>

                    </div>



                    <!-- OTP -->

                    <div class="form-group">

                        <label>
                            🔐 Your 4-Digit OTP
                        </label>


                        <div class="otp-wrapper">

                            <input
                                type="password"
                                id="otp"
                                maxlength="4"
                                minlength="4"
                                pattern="[0-9]{4}"
                                inputmode="numeric"
                                autocomplete="off"
                                placeholder="Enter 4-digit OTP"
                                required>


                            <button
                                type="button"
                                class="toggle-otp"
                                id="toggleOtp">

                                SHOW

                            </button>

                        </div>


                        <div
                            id="otpStatus"
                            class="otp-status">
                        </div>

                    </div>



                    <!-- AMOUNT -->

                    <div class="form-group">

                        <label>
                            💰 Amount
                        </label>


                        <input
                            type="number"
                            id="amount"
                            min="0.01"
                            step="0.01"
                            inputmode="decimal"
                            placeholder="Enter amount"
                            required>

                    </div>



                    <!-- CATEGORY -->

                    <div class="form-group">

                        <label>
                            📂 Category
                        </label>


                        <select
                            id="category"
                            required>

                            <option value="">
                                Select Category
                            </option>

                            <option value="Food">
                                Food
                            </option>

                            <option value="Travel">
                                Travel
                            </option>

                            <option value="Fuel">
                                Fuel
                            </option>

                            <option value="Shopping">
                                Shopping
                            </option>

                            <option value="Office">
                                Office
                            </option>

                            <option value="Medical">
                                Medical
                            </option>

                            <option value="Entertainment">
                                Entertainment
                            </option>

                            <option value="Utilities">
                                Utilities
                            </option>

                            <option value="Accommodation">
                                Accommodation
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>



                    <!-- REASON -->

                    <div class="form-group full-width">

                        <label>
                            📝 Reason for Spending
                        </label>


                        <input
                            type="text"
                            id="reason"
                            maxlength="150"
                            placeholder="What was the money spent for?"
                            required>

                    </div>



                    <!-- COMMENT -->

                    <div class="form-group full-width">

                        <label>
                            💬 Comment
                        </label>


                        <textarea
                            id="comment"
                            maxlength="500"
                            placeholder="Optional comment...">
                        </textarea>

                    </div>



                    <!-- RECEIPT -->

                    <div class="form-group full-width">

                        <label>
                            🧾 Receipt
                        </label>


                        <div
                            class="receipt-upload">


                            <input
                                type="file"
                                id="receipt"
                                accept="image/*,.pdf"
                                capture="environment">


                            <div
                                class="upload-content">

                                <div
                                    class="upload-icon">
                                    📷
                                </div>


                                <div
                                    class="upload-title">

                                    Upload Receipt

                                </div>


                                <div
                                    class="upload-subtitle">

                                    Tap to take a photo
                                    or select a file

                                </div>

                            </div>

                        </div>


                        <div
                            class="receipt-preview"
                            id="receiptPreview">

                            <img
                                id="previewImage"
                                alt="Receipt Preview">

                            <div
                                class="file-name"
                                id="fileName">
                            </div>

                        </div>

                    </div>



                    <!-- SAVE -->

                    <div
                        class="form-group full-width">

                        <button
                            type="submit"
                            class="save-btn"
                            id="saveBtn"
                            disabled>

                            🔒 ENTER USER & OTP

                        </button>

                    </div>


                </div>

            </form>

        </section>



        <!-- =================================================
             TRANSACTION HISTORY
        ================================================== -->

        <section class="card">

            <div class="card-title">
                📋 This Month's Transactions
            </div>


            <div class="filter-row">


                <select
                    id="filterUser">

                    <option value="">
                        All Users
                    </option>

                </select>


                <select
                    id="filterCategory">

                    <option value="">
                        All Categories
                    </option>

                </select>

            </div>


            <div
                id="transactionList"
                class="transaction-list">
            </div>


            <button
                class="export-btn"
                id="exportBtn">

                📥 Export This Month to CSV

            </button>

        </section>


    </main>

</div>



<!-- =====================================================
     TOAST
====================================================== -->

<div
    class="toast"
    id="toast">
</div>



<!-- =====================================================
     LOADING
====================================================== -->

<div
    class="loading"
    id="loading">

    <div class="loading-box">

        <div class="spinner"></div>

        <div>
            Saving expense...
        </div>

    </div>

</div>



<script>

/* =========================================================
   USER + OTP CONFIGURATION
   =========================================================

   CHANGE THESE USERS AND OTPs.

   Each user has a UNIQUE 4-digit OTP.

   IMPORTANT:
   Because this is a single HTML file, anyone who can inspect
   the source code can technically see these OTPs.

   This is suitable for a small trusted group.

========================================================= */

const USERS = {

    "Anand": "4821",

    "Amit": "7392",

    "Ashiwini": "6158",

    "Ravi": "9274",

    "Jayant": "3618",
	
	"Divank": "1850",
	
	"Sandeep": "9522"

};


/* =========================================================

/* =========================================================

========================================================= */

function getCurrentMonth() {

    const date =
        new Date();


    return (

        date.getFullYear()
        + "-"
        + String(
            date.getMonth() + 1
        ).padStart(2, "0")

    );

}


function getMonthName() {

    return new Date()
        .toLocaleString(
            "en-IN",
            {
                month: "long",
                year: "numeric"
            }
        );

}


document.getElementById(

/* =========================================================

function initializeUsers() {

        USERS
    ).forEach(

            /* Main user dropdown */

                );

/* =========================================================
   OTP VALIDATION
========================================================= */

function validateUserOTP(
    selectedUser,
    enteredOTP
) {

    if (!selectedUser) {

        return false;

    }


    if (!enteredOTP) {

        return false;

    }


    const correctOTP =
        USERS[
            selectedUser
        ];


    if (!correctOTP) {

        return false;

    }


    return (
        enteredOTP.trim() ===
        correctOTP
    );

}


/* =========================================================
   UPDATE OTP STATUS
========================================================= */

function updateOTPStatus() {

    const selectedUser =
        username.value;

    const enteredOTP =
        otp.value.trim();


    saveBtn.disabled =
        true;


    saveBtn.textContent =
        "🔒 ENTER USER & OTP";


    otpStatus.textContent =
        "";


    otpStatus.className =
        "otp-status";


    if (!selectedUser) {

        return;

    }


    if (!enteredOTP) {

        return;

    }


    if (
        enteredOTP.length !== 4
    ) {

        otpStatus.textContent =
            "OTP must contain 4 digits.";

        otpStatus.classList.add(
            "otp-invalid"
        );

        return;

    }


    if (
        validateUserOTP(
            selectedUser,
            enteredOTP
        )
    ) {

        otpStatus.textContent =
            "✓ OTP verified for "
            + selectedUser;

        otpStatus.classList.add(
            "otp-valid"
        );


        saveBtn.disabled =
            false;

        saveBtn.textContent =
            "💾 SAVE EXPENSE";

    } else {

        otpStatus.textContent =
            "✕ Incorrect OTP for "
            + selectedUser;

        otpStatus.classList.add(
            "otp-invalid"
        );

    }

}

username.addEventListener(

receipt.addEventListener(

/* =========================================================
   LOCAL STORAGE
========================================================= */

function getTransactions() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "cashTransactions"
            ) || "[]"
        );

    } catch (error) {

        return [];

    }

}


function saveTransactions(
    transactions
) {

    localStorage.setItem(
        "cashTransactions",
        JSON.stringify(
            transactions
        )
    );

}


/* =========================================================
   TRANSACTION ID
========================================================= */

function generateTransactionId() {

    const now =
        new Date();


    const date =
        now.getFullYear()
        + String(
            now.getMonth() + 1
        ).padStart(2, "0")
        + String(
            now.getDate()
        ).padStart(2, "0");


    const time =
        String(
            now.getHours()
        ).padStart(2, "0")
        +
        String(
            now.getMinutes()
        ).padStart(2, "0")
        +
        String(
            now.getSeconds()
        ).padStart(2, "0");


    const random =
        Math.random()
        .toString(36)
        .substring(
            2,
            6
        )
        .toUpperCase();


    return (
        "EXP-"
        + date
        + "-"
        + time
        + "-"
        + random
    );

}


/* =========================================================
   FILE TO DATA URL
========================================================= */

function readFileAsDataURL(
    file
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const reader =
                new FileReader();


            reader.onload =
                function() {

                    resolve(
                        reader.result
                    );

                };


            reader.onerror =
                function(error) {

                    reject(
                        error
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================================================
   FORM SUBMIT
========================================================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /* -----------------------------------------------
           USER
        ------------------------------------------------ */

        const selectedUser =
            username.value.trim();


        /* -----------------------------------------------
           OTP
        ------------------------------------------------ */

        const enteredOTP =
            otp.value.trim();


        /*
            FINAL SECURITY CHECK

            Even if someone manipulates the
            Save button using browser tools,
            this check happens again.
        */

        if (
            !validateUserOTP(
                selectedUser,
                enteredOTP
            )
        ) {

            showToast(
                "Invalid OTP. Record cannot be saved.",
                "error"
            );

            updateOTPStatus();

            otp.focus();

            return;

        }


        /* -----------------------------------------------
           OTHER VALUES
        ------------------------------------------------ */

        const enteredAmount =
            parseFloat(
                amount.value
            );


        const selectedCategory =
            category.value;


        const enteredReason =
            reason.value.trim();


        const enteredComment =
            comment.value.trim();


        const file =
            receipt.files[0];


        /* -----------------------------------------------
           VALIDATE AMOUNT
        ------------------------------------------------ */

        if (
            !enteredAmount ||
            enteredAmount <= 0
        ) {

            showToast(
                "Please enter a valid amount.",
                "error"
            );

            amount.focus();

            return;

        }


        /* -----------------------------------------------
           CATEGORY
        ------------------------------------------------ */

        if (
            !selectedCategory
        ) {

            showToast(
                "Please select a category.",
                "error"
            );

            return;

        }


        /* -----------------------------------------------
           REASON
        ------------------------------------------------ */

        if (
            !enteredReason
        ) {

            showToast(
                "Please enter the reason.",
                "error"
            );

            reason.focus();

            return;

        }


        /* -----------------------------------------------
           CREATE TRANSACTION
        ------------------------------------------------ */

        const now =
            new Date();


        const transaction = {

            id:
                generateTransactionId(),

            date:
                now.toISOString(),

            month:
                getCurrentMonth(),

            username:
                selectedUser,

            amount:
                enteredAmount,

            category:
                selectedCategory,

            reason:
                enteredReason,

            comment:
                enteredComment,

            receiptName:
                file
                    ? file.name
                    : "",

            receiptData:
                "",

            receiptUrl:
                ""

        };


        /* -----------------------------------------------
           RECEIPT
        ------------------------------------------------ */

        if (file) {

            try {

                transaction.receiptData =
                    await readFileAsDataURL(
                        file
                    );

            } catch (error) {

                console.error(
                    error
                );

                showToast(
                    "Unable to read receipt.",
                    "error"
                );

                return;

            }

        }


        /* -----------------------------------------------
           SAVE LOCAL
        ------------------------------------------------ */

        showLoading(
            true
        );


        try {

            const transactions =
                getTransactions();


            transactions.unshift(
                transaction
            );


            saveTransactions(
                transactions
            );


            /*
                GOOGLE DRIVE

                If GOOGLE_SCRIPT_URL is
                configured, send the record
                to Google Apps Script.

            */

            if (
                GOOGLE_SCRIPT_URL
            ) {

                const result =
                    await uploadToGoogleDrive(
                        transaction,
                        file
                    );


                if (
                    result &&
                    result.receiptUrl
                ) {

                    updateReceiptUrl(
                        transaction.id,
                        result.receiptUrl
                    );

                }

            }


            /* ---------------------------------------
               SUCCESS
            --------------------------------------- */

            showToast(
                "✓ Expense saved successfully!",
                "success"
            );


            form.reset();


            otpStatus.textContent =
                "";


            otpStatus.className =
                "otp-status";


            receiptPreview.style.display =
                "none";


            saveBtn.disabled =
                true;


            saveBtn.textContent =
                "🔒 ENTER USER & OTP";


            renderTransactions();

            updateSummary();

        } catch (error) {

            console.error(
                error
            );


            showToast(
                "Unable to save expense.",
                "error"
            );

        } finally {

            showLoading(
                false
            );

        }

    }
);


/* =========================================================
   GOOGLE DRIVE UPLOAD
========================================================= */

async function uploadToGoogleDrive(
    transaction,
    file
) {

    /*
        This function is ready for the
        Google Apps Script backend.

        The Apps Script backend can:

        1. Validate user + OTP
        2. Find/create current month folder
        3. Find/create username folder
        4. Upload receipt
        5. Save transaction in Google Sheet
        6. Return receipt URL
    */


    const payload = {

        action:
            "saveExpense",

        transaction:
            transaction,

        receipt:
            file
                ? await readFileAsDataURL(
                    file
                  )
                : null

    };


    const response =
        await fetch(
            GOOGLE_SCRIPT_URL,
            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify(
                        payload
                    )

            }
        );


    const result =
        await response.json();


    if (
        !result.success
    ) {

        throw new Error(
            result.message ||
            "Google Drive upload failed."
        );

    }


    return result;

}


/* =========================================================
   UPDATE RECEIPT URL
========================================================= */

function updateReceiptUrl(
    transactionId,
    url
) {

    const transactions =
        getTransactions();


    const transaction =
        transactions.find(
            item =>
                item.id ===
                transactionId
        );


    if (
        transaction
    ) {

        transaction.receiptUrl =
            url;


        saveTransactions(
            transactions
        );

    }

}


/* =========================================================
   RENDER TRANSACTIONS
========================================================= */

function renderTransactions() {

    const transactions =
        getTransactions();


    const selectedUser =
        filterUser.value;


    const selectedCategory =
        filterCategory.value;


    const filtered =
        transactions.filter(
            transaction => {


                if (
                    transaction.month !==
                    getCurrentMonth()
                ) {

                    return false;

                }


                if (
                    selectedUser &&
                    transaction.username !==
                    selectedUser
                ) {

                    return false;

                }


                if (
                    selectedCategory &&
                    transaction.category !==
                    selectedCategory
                ) {

                    return false;

                }


                return true;

            }
        );


    transactionList.innerHTML =
        "";


    if (
        filtered.length === 0
    ) {

        transactionList.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    💸
                </div>

                <div class="empty-title">
                    No transactions found
                </div>

                <div class="empty-text">
                    Add your first cash expense above.
                </div>

            </div>

        `;

        return;

    }


    filtered.forEach(
        transaction => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "transaction";


            const date =
                new Date(
                    transaction.date
                );


            const formattedDate =
                date.toLocaleDateString(
                    "en-IN",
                    {
                        day:
                            "2-digit",

                        month:
                            "short",

                        year:
                            "numeric"
                    }
                );


            const formattedTime =
                date.toLocaleTimeString(
                    "en-IN",
                    {
                        hour:
                            "2-digit",

                        minute:
                            "2-digit"
                    }
                );


            card.innerHTML = `

                <div class="transaction-top">

                    <div>

                        <div
                            class="transaction-category">

                            ${escapeHTML(
                                transaction.category
                            )}

                        </div>


                        <div
                            class="transaction-reason">

                            ${escapeHTML(
                                transaction.reason
                            )}

                        </div>


                        ${
                            transaction.comment
                            ?

                            `
                            <div
                                class="transaction-comment">

                                ${escapeHTML(
                                    transaction.comment
                                )}

                            </div>
                            `

                            :

                            ""
                        }

                    </div>


                    <div
                        class="transaction-amount">

                        ${formatCurrency(
                            transaction.amount
                        )}

                    </div>

                </div>


                <div
                    class="transaction-meta">

                    <span>
                        👤
                        ${escapeHTML(
                            transaction.username
                        )}
                    </span>


                    <span>

                        ${formattedDate}
                        ·
                        ${formattedTime}

                    </span>

                </div>


                <div
                    class="transaction-actions">

                    ${
                        transaction.receiptData ||
                        transaction.receiptUrl

                        ?

                        `
                        <button
                            class="small-btn receipt-btn"
                            onclick="viewReceipt(
                                '${transaction.id}'
                            )">

                            🧾 Receipt

                        </button>
                        `

                        :

                        ""
                    }


                    <button
                        class="small-btn delete-btn"
                        onclick="deleteTransaction(
                            '${transaction.id}'
                        )">

                        🗑 Delete

                    </button>

                </div>

            `;


            transactionList.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   VIEW RECEIPT
========================================================= */

function viewReceipt(
    transactionId
) {

    const transactions =
        getTransactions();


    const transaction =
        transactions.find(
            item =>
                item.id ===
                transactionId
        );


    if (
        !transaction
    ) {

        return;

    }


    if (
        transaction.receiptUrl
    ) {

        window.open(
            transaction.receiptUrl,
            "_blank"
        );

        return;

    }


    if (
        transaction.receiptData
    ) {

        const newWindow =
            window.open();


        if (
            !newWindow
        ) {

            showToast(
                "Please allow popups to view receipt.",
                "error"
            );

            return;

        }


        newWindow.document.write(`

            <!DOCTYPE html>

            <html>

            <head>

                <title>
                    Receipt
                </title>

                <meta
                    name="viewport"
                    content="width=device-width,
                             initial-scale=1">

                <style>

                    body {

                        margin:0;

                        background:#111827;

                        min-height:100vh;

                        display:flex;

                        align-items:center;

                        justify-content:center;

                    }

                    img {

                        max-width:100%;

                        max-height:100vh;

                        object-fit:contain;

                    }

                </style>

            </head>


            <body>

                <img
                    src="${transaction.receiptData}"
                    alt="Receipt">

            </body>

            </html>

        `);


        newWindow.document.close();

    }

}


/* =========================================================
   DELETE TRANSACTION
========================================================= */

function deleteTransaction(
    transactionId
) {

    const transactions =
        getTransactions();


    const transaction =
        transactions.find(
            item =>
                item.id ===
                transactionId
        );


    if (
        !transaction
    ) {

        return;

    }


    const confirmation =
        confirm(

            "Delete this transaction?\n\n"

            + transaction.reason

            + "\n"

            + formatCurrency(
                transaction.amount
            )

        );


    if (
        !confirmation
    ) {

        return;

    }


    const remaining =
        transactions.filter(
            item =>
                item.id !==
                transactionId
        );


    saveTransactions(
        remaining
    );


    renderTransactions();

    updateSummary();


    showToast(
        "Transaction deleted.",
        "success"
    );

}


/* =========================================================
   SUMMARY
========================================================= */

function updateSummary() {

    const transactions =
        getTransactions()
        .filter(
            transaction =>
                transaction.month ===
                getCurrentMonth()
        );


    const total =
        transactions.reduce(
            (
                sum,
                transaction
            ) =>

                sum +
                Number(
                    transaction.amount
                ),

            0
        );


    const users =
        new Set(
            transactions.map(
                transaction =>
                    transaction.username
            )
        );


    const categories =
        new Set(
            transactions.map(
                transaction =>
                    transaction.category
            )
        );


    document.getElementById(
        "totalAmount"
    ).textContent =
        formatCurrency(
            total
        );


    document.getElementById(
        "transactionCount"
    ).textContent =
        transactions.length;


    document.getElementById(
        "userCount"
    ).textContent =
        users.size;


    document.getElementById(
        "categoryCount"
    ).textContent =
        categories.size;

}


/* =========================================================
   FILTERS
========================================================= */

filterUser.addEventListener(
    "change",
    renderTransactions
);


filterCategory.addEventListener(
    "change",
    renderTransactions
);


/* =========================================================
   CSV EXPORT
========================================================= */

document.getElementById(
    "exportBtn"
).addEventListener(
    "click",
    function() {


        const transactions =
            getTransactions()
            .filter(
                transaction =>
                    transaction.month ===
                    getCurrentMonth()
            );


        if (
            transactions.length === 0
        ) {

            showToast(
                "No transactions to export.",
                "error"
            );

            return;

        }


        const headers = [

            "Transaction ID",

            "Date",

            "Username",

            "Amount",

            "Category",

            "Reason",

            "Comment",

            "Receipt"

        ];


        const rows =
            transactions.map(
                transaction => [

                    transaction.id,

                    new Date(
                        transaction.date
                    ).toLocaleString(
                        "en-IN"
                    ),

                    transaction.username,

                    transaction.amount,

                    transaction.category,

                    transaction.reason,

                    transaction.comment,

                    transaction.receiptUrl ||
                    transaction.receiptName

                ]
            );


        const csv = [

            headers,

            ...rows

        ]

        .map(
            row =>

                row.map(
                    value =>

                        `"${String(
                            value ?? ""
                        )
                        .replace(
                            /"/g,
                            '""'
                        )}"`
                )

                .join(",")

        )

        .join("\n");


        const blob =
            new Blob(
                [csv],
                {
                    type:
                        "text/csv;charset=utf-8;"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            "Cash_Records_"
            + getCurrentMonth()
            + ".csv";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        URL.revokeObjectURL(
            url
        );


        showToast(
            "CSV exported successfully.",
            "success"
        );

    }
);


/* =========================================================
   CURRENCY
========================================================= */

function formatCurrency(
    value
) {

    return new Intl.NumberFormat(
        "en-IN",
        {

            style:
                "currency",

            currency:
                "INR",

            maximumFractionDigits:
                2

        }
    ).format(
        Number(value) || 0
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(
    message,
    type = ""
) {

    clearTimeout(
        toastTimer
    );


    toast.textContent =
        message;


    toast.className =
        "toast show "
        + type;


    toastTimer =
        setTimeout(
            function() {

                toast.className =
                    "toast";

            },
            3000
        );

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(
    show
) {

    loading.style.display =
        show
            ? "flex"
            : "none";

}


/* =========================================================
   INITIALIZATION
========================================================= */

initializeUsers();

renderTransactions();

updateSummary();

</script>
